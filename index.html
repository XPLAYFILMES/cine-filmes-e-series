<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ========================================================
       1. CABEÇALHO DO DOCUMENTO E METADADOS
       ======================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorirOnline - Pintura por Números</title>
    <link rel="stylesheet" href="css/style.css?v=60">
</head>
<body>

    <!-- ========================================================
       2. CABEÇALHO PRINCIPAL E BARRA DE NAVEGAÇÃO
       ======================================================== -->
    <header class="cabecalho-principal">
        <div class="container-nav">
            <a href="index.html" class="logo">
                🎨 Colorir<span class="destaque">Online</span>
            </a>
            <div class="container-busca">
                <span class="icone-busca">🔍</span>
                <input type="text" id="campo-busca" placeholder="Pesquisar desenhos, categorias...">
            </div>
            <nav class="links-navegacao">
                <a href="index.html" class="link-nav ativo">🎨 Colorir</a>
                <a href="jogos.html" class="link-nav">🧩 Jogos</a>
                <a href="atividades.html" class="link-nav">📚 Atividades Escolares</a>
                <button id="btn-tema-global" class="btn-tema">🌙</button>
            </nav>
        </div>
    </header>

   <!-- ========================================================
       3. BANNER DE DESTAQUE (CARD AZUL ORIGINAL)
       ======================================================== -->
    <section class="banner-novidades">
        <div class="conteudo-banner">
            <h2>✨ Novos Desenhos Adicionados!</h2>
            <p>Escolha uma ilustração com números ou solte a criatividade com o pincel livre.</p>
        </div>
    </section>

    <!-- ========================================================
       4. ATALHO: CONTINUAR PINTANDO (INJETADO SE HOUVER PROGRESSO)
       ======================================================== -->
    <div id="container-continuar"></div>

    <!-- ========================================================
       5. FILTROS POR CATEGORIA
       ======================================================== -->
    <section class="filtros-categoria">
        <button class="btn-categoria ativo" data-cat="todos">Todos</button>
        <button class="btn-categoria" data-cat="animais">Animais</button>
        <button class="btn-categoria" data-cat="infantil">Infantil</button>
        <button class="btn-categoria" data-cat="mandalas">Mandalas</button>
    </section>

    <!-- ========================================================
       6. ABAS DE STATUS DE CONCLUSÃO
       ======================================================== -->
    <section class="abas-status">
        <button class="btn-aba ativa" data-filtro="todos">Todos os Desenhos</button>
        <button class="btn-aba" data-filtro="progresso">⏳ Em Progresso (<span id="qtd-progresso">0</span>)</button>
        <button class="btn-aba" data-filtro="finalizados">✅ Finalizados (<span id="qtd-finalizados">0</span>)</button>
    </section>

    <!-- ========================================================
       7. GRELHA DE 5 COLUNAS (COM MINISVGS COLORIDOS)
       ======================================================== -->
    <main class="catalogo-desenhos" id="catalogo"></main>

    <!-- ========================================================
       8. BARRA DE PAGINAÇÃO (30 ITENS POR PÁGINA)
       ======================================================== -->
    <nav class="container-paginacao" id="container-paginacao">
        <button class="btn-pag" id="btn-pag-anterior" disabled>← Anterior</button>
        <div class="numeros-paginacao" id="numeros-paginacao"></div>
        <button class="btn-pag" id="btn-pag-proximo">Próximo →</button>
    </nav>

    <!-- ========================================================
       9. CARREGAMENTO DOS SCRIPTS
       ======================================================== -->
    <script src="js/catalogo.js?v=20"></script>
</body>
</html>
