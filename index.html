<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro de Colorir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- CABEÇALHO E MENU SUPERIOR -->
    <header class="barra-navegacao">
        <div class="logo">🎨 ColorirOnline</div>
        <nav class="menu-categorias">
            <button class="btn-categoria ativo">Todos</button>
            <button class="btn-categoria">Animais</button>
            <button class="btn-categoria">Mandalas</button>
            <button class="btn-categoria">Infantil</button>
        </nav>
    </header>
    <!-- BANNER DE NOVIDADES -->
    <section class="banner-novidades">
        <div class="texto-novidade">
            <h2>✨ Novos Desenhos Adicionados!</h2>
            <p>Escolha uma ilustração com números ou pinte com pincel livre.</p>
        </div>
    </section>
    <!-- GRELHA DE DESENHOS / LIVRO -->
    <main class="catalogo-desenhos">
        <!-- Cartão 1 -->
        <div class="card-desenho">
            <div class="tag-categoria">Animais</div>
            <div class="preview-imagem">⭐ Estrela Mágica</div>
            <a href="pintar.html" class="btn-jogar">Colorir Agora</a>
        </div>

        <!-- Cartão 2 -->
        <div class="card-desenho">
            <div class="tag-categoria">Infantil</div>
            <div class="preview-imagem">🚀 Foguetão Espacial</div>
            <a href="pintar.html" class="btn-jogar">Colorir Agora</a>
        </div>

        <!-- Cartão 3 -->
        <div class="card-desenho">
            <div class="tag-categoria">Mandalas</div>
            <div class="preview-imagem">🌸 Flor Geométrica</div>
            <a href="pintar.html" class="btn-jogar">Colorir Agora</a>
        </div>
    </main>
            <!-- Camada transparente para o pincel livre -->
            <canvas id="camada-pincel" width="300" height="300"></canvas>
        </div>
    </main>
    <!-- LIGAÇÃO DO SCRIPT JAVASCRIPT -->
    <script src="js/app.js"></script>
</body>
</html>
