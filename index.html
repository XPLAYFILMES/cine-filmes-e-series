<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro de Colorir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- CABEÇALHO E MENU SUPERIOR -->
    <header class="barra-navegacao">
        <div class="logo">🎨 ColorirOnline</div>
        <nav class="menu-categorias">
            <button class="btn-categoria ativo">Todos</button>
            <button class="btn-categoria">Animais</button>
            <button class="btn-categoria">Mandalas</button>
            <button class="btn-categoria">Infantil</button>
        </nav>
    </header>
    <!-- BANNER DE NOVIDADES -->
    <section class="banner-novidades">
        <div class="texto-novidade">
            <h2>✨ Novos Desenhos Adicionados!</h2>
            <p>Escolha uma ilustração com números ou pinte com pincel livre.</p>
        </div>
    </section>
    <!-- GRELHA DE DESENHOS / LIVRO -->
   <!-- ABAS DE ESTADO DO UTILIZADOR -->
    <div class="abas-status">
        <button class="btn-aba ativa" data-filtro="todos">Todos</button>
        <button class="btn-aba" data-filtro="progresso">⏳ Em Progresso (<span id="qtd-progresso">0</span>)</button>
        <button class="btn-aba" data-filtro="finalizados">✅ Finalizados (<span id="qtd-finalizados">0</span>)</button>
    </div>

    <!-- ABAS DE ESTADO DO UTILIZADOR -->
    <div class="abas-status">
        <button class="btn-aba ativa" data-filtro="todos">Todos</button>
        <button class="btn-aba" data-filtro="progresso">⏳ Em Progresso (<span id="qtd-progresso">0</span>)</button>
        <button class="btn-aba" data-filtro="finalizados">✅ Finalizados (<span id="qtd-finalizados">0</span>)</button>
    </div>

    <!-- GRELHA DE DESENHOS -->
    <main class="catalogo-desenhos">
        <!-- Cartão 1: Estrela Mágica -->
        <div class="card-desenho" id="card-estrela" data-id="desenho_1" data-categoria="animais">
            <div class="tag-categoria">Animais</div>
            <div class="preview-imagem">⭐ Estrela Mágica</div>
            
            <!-- Barra de Progresso do Card -->
            <div class="container-progresso">
                <div class="barra-progresso" id="progresso-card-desenho_1" style="width: 0%;"></div>
            </div>
            <span class="texto-progresso" id="texto-card-desenho_1">0% Concluído</span>

            <a href="pintar.html?id=desenho_1" class="btn-jogar">Colorir Agora</a>
        </div>

        <!-- Cartão 2: Foguetão Espacial -->
        <div class="card-desenho" id="card-foguete" data-id="desenho_2" data-categoria="infantil">
            <div class="tag-categoria">Infantil</div>
            <div class="preview-imagem">🚀 Foguetão Espacial</div>
            
            <div class="container-progresso">
                <div class="barra-progresso" id="progresso-card-desenho_2" style="width: 0%;"></div>
            </div>
            <span class="texto-progresso" id="texto-card-desenho_2">0% Concluído</span>

            <a href="pintar.html?id=desenho_2" class="btn-jogar">Colorir Agora</a>
        </div>

        <!-- Cartão 3: Flor Geométrica -->
        <div class="card-desenho" id="card-flor" data-id="desenho_3" data-categoria="mandalas">
            <div class="tag-categoria">Mandalas</div>
            <div class="preview-imagem">🌸 Flor Geométrica</div>
            
            <div class="container-progresso">
                <div class="barra-progresso" id="progresso-card-desenho_3" style="width: 0%;"></div>
            </div>
            <span class="texto-progresso" id="texto-card-desenho_3">0% Concluído</span>

            <a href="pintar.html?id=desenho_3" class="btn-jogar">Colorir Agora</a>
        </div>
    </main>

    <script src="./js/catalogo.js"></script>
