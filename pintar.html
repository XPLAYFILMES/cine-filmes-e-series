<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ========================================================
       1. CABEÇALHO DO DOCUMENTO E METADADOS
       ======================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintar Desenho - ColorirOnline</title>
    <link rel="stylesheet" href="css/style.css?v=25">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="pagina-pintura">

    <!-- ========================================================
       2. BARRA DE FERRAMENTAS SUPERIOR (ORGANIZADA E RESPONSIVA)
       ======================================================== -->
    <header class="barra-ferramentas">
        <a href="index.html" class="btn-voltar">⬅ Catálogo</a>
        
        <div class="grupo-ferramentas">
            <button id="btn-modo-balde" class="btn-ferramenta ativo">🎨 Números</button>
            <button id="btn-modo-pincel" class="btn-ferramenta">🖌 Pincel</button>
            <button id="btn-desfazer" class="btn-ferramenta">↩ Desfazer</button>
            <button id="btn-dica" class="btn-ferramenta btn-dica">💡 Dica</button>
            <button id="btn-zoom-in" class="btn-ferramenta">🔍 +</button>
            <button id="btn-zoom-out" class="btn-ferramenta">🔍 -</button>
            <button id="btn-tela-cheia" class="btn-ferramenta">⛶ Tela Cheia</button>
            <button id="btn-limpar" class="btn-ferramenta">🗑 Limpar</button>
            <button id="btn-salvar" class="btn-ferramenta">💾 Salvar</button>
            <button id="btn-tema-pintar" class="btn-ferramenta btn-tema-icone">🌙</button>
        </div>
    </header>

    <!-- ========================================================
       3. BARRA DE PROGRESSO EM TEMPO REAL
       ======================================================== -->
    <div class="painel-progresso-topo">
        <div class="trilha-progresso">
            <div id="barra-progresso-ativa" class="barra-preenchimento"></div>
        </div>
        <span id="texto-progresso-ativo">0% Concluído</span>
    </div>

    <!-- ========================================================
       4. ÁREA DA PRANCHETA COM SUPORTE A ZOOM
       ======================================================== -->
    <main class="area-prancheta" id="container-pan">
        <div class="prancheta-wrapper" id="prancheta-wrapper">
            <div class="prancheta" id="prancheta">
                <svg id="desenho-svg" viewBox="0 0 300 300"></svg>
                <canvas id="camada-pincel" width="320" height="320"></canvas>
            </div>
        </div>
    </main>

    <!-- ========================================================
       5. PALETA DE CORES NUMERADA (RODAPÉ)
       ======================================================== -->
    <footer class="barra-paleta" id="barra-paleta">
        <div class="item-cor ativa" data-numero="1" data-hex="#e74c3c" style="background-color: #e74c3c;">1</div>
        <div class="item-cor" data-numero="2" data-hex="#3498db" style="background-color: #3498db;">2</div>
        <div class="item-cor" data-numero="3" data-hex="#f1c40f" style="background-color: #f1c40f;">3</div>
        <div class="item-cor" data-numero="4" data-hex="#2ecc71" style="background-color: #2ecc71;">4</div>
        <div class="item-cor" data-numero="5" data-hex="#9b59b6" style="background-color: #9b59b6;">5</div>
    </footer>

    <!-- ========================================================
       6. MODAL DE CONCLUSÃO COM BOTÃO PARA IMPRIMIR EM FOLHA A4
       ======================================================== -->
    <div id="modal-conclusao" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2>🎉 Obra Concluída!</h2>
            <p>Você completou todos os números com perfeição!</p>
            <div class="preview-final-modal">
                <img id="img-modal-preview" alt="Prévia Concluída" src="">
            </div>
            <div class="grupo-acoes-modal">
                <button id="btn-modal-png" class="btn-modal-acao btn-acao-png">📥 Baixar Imagem HD</button>
                <button id="btn-modal-imprimir" class="btn-modal-acao btn-acao-imprimir">🖨 Imprimir em Folha A4</button>
                <button id="btn-modal-fechar" class="btn-modal-acao btn-acao-fechar">Fechar</button>
            </div>
        </div>
    </div>

    <!-- ========================================================
       7. CARREGAMENTO DOS SCRIPTS
       ======================================================== -->
    <script src="js/app.js?v=25"></script>
</body>
</html>
