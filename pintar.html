<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ========================================================
       1. CABEÇALHO DO DOCUMENTO E METADADOS
       ======================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintar Desenho - ColorirOnline</title>
    <link rel="stylesheet" href="css/style.css?v=15">
    <!-- Biblioteca externa para animação de confetes ao atingir 100% -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="pagina-pintura">

    <!-- ========================================================
       2. BARRA DE FERRAMENTAS SUPERIOR
       ======================================================== -->
    <header class="barra-ferramentas">
        <a href="index.html" class="btn-voltar">⬅ Voltar ao Catálogo</a>
        <div class="grupo-ferramentas">
            <button id="btn-modo-balde" class="btn-ferramenta ativo">🎨 Modo Números</button>
            <button id="btn-modo-pincel" class="btn-ferramenta">🖌 Pincel Livre</button>
            <button id="btn-tela-cheia" class="btn-ferramenta">⛶ Tela Cheia</button>
            <button id="btn-limpar" class="btn-ferramenta">🗑 Limpar</button>
            <button id="btn-salvar" class="btn-ferramenta">💾 Salvar</button>
        </div>
    </header>

    <!-- ========================================================
       3. BARRA DE PROGRESSO EM TEMPO REAL
       ======================================================== -->
    <div class="painel-progresso-topo">
        <div class="trilha-progresso">
            <div id="barra-progresso-ativa" class="barra-preenchimento"></div>
        </div>
        <span id="texto-progresso-ativo">0% Concluído</span>
    </div>

    <!-- ========================================================
       4. AVISO DE CONCLUSÃO (100%)
       ======================================================== -->
    <div id="aviso-parabens" class="modal-parabens">
        🎉 Parabéns! Você concluiu este desenho!
    </div>

    <!-- ========================================================
       5. ÁREA DA PRANCHETA (DESENHO SVG E CANVAS)
       ======================================================== -->
    <main class="area-prancheta" id="container-prancheta">
        <div class="prancheta" id="prancheta">
            <svg id="desenho-svg" viewBox="0 0 300 300"></svg>
            <canvas id="camada-pincel" width="320" height="320"></canvas>
        </div>
    </main>

    <!-- ========================================================
       6. PALETA DE CORES NUMERADA (RENDERIZADA DINAMICAMENTE)
       ======================================================== -->
    <footer class="barra-paleta" id="barra-paleta">
        <!-- As cores serão inseridas aqui dinamicamente pelo JavaScript -->
    </footer>

    <!-- ========================================================
       7. CARREGAMENTO DO SCRIPT DO MOTOR DE PINTURA
       ======================================================== -->
    <script src="js/app.js?v=7"></script>
</body>
</html>
