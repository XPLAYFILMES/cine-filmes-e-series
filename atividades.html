<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ========================================================
       1. CABEÇALHO DO DOCUMENTO E METADADOS
       ======================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades Escolares Online - ColorirOnline</title>
    <link rel="stylesheet" href="css/style.css?v=95">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- ========================================================
       2. CABEÇALHO PRINCIPAL E BARRA DE NAVEGAÇÃO
       ======================================================== -->
    <header class="cabecalho-principal">
        <div class="container-nav">
            <a href="index.html" class="logo">
                🎨 Colorir<span class="destaque">Online</span>
            </a>
            <div class="container-busca">
                <span class="icone-busca">🔍</span>
                <input type="text" id="campo-busca" placeholder="Pesquisar atividades, disciplinas...">
            </div>
            <nav class="links-navegacao">
                <a href="index.html" class="link-nav">🎨 Colorir</a>
                <a href="jogos.html" class="link-nav">🧩 Jogos</a>
                <a href="atividades.html" class="link-nav ativo">📚 Atividades Escolares</a>
                <button id="btn-tema-atividades" class="btn-tema">🌙</button>
            </nav>
        </div>
    </header>

    <!-- ========================================================
       3. BANNER DE JOGOS (FAIXA ROXA - MESMO TAMANHO PADRÃO)
       ======================================================== -->
    <section class="banner-novidades" style="width: 100% !important; background: #7c3aed !important; background: linear-gradient(90deg, #6d28d9, #7c3aed, #a855f7) !important; padding: 22px 0 !important; margin: 0 0 20px 0 !important; display: block !important;">
        <div class="conteudo-banner" style="max-width: 1350px; margin: 0 auto; padding: 0 24px; text-align: left;">
            <h2 style="font-size: 1.8rem; font-weight: 800; color: #ffffff !important; margin-bottom: 4px; display: flex; align-items: center; gap: 8px;">
                🧩 Jogos e Desafios para Todas as Idades
            </h2>
            <p style="font-size: 0.95rem; color: #f1f5f9 !important; margin: 0; opacity: 0.95;">
                Exercite a mente com Caça-Palavras, Jogo da Memória e Quebra-Cabeças!
            </p>
        </div>
    </section>

    <!-- ========================================================
       4. FILTRO POR ANO ESCOLAR / SÉRIE (ORGANIZADOS NO FUNDO CINZA)
       ======================================================== -->
    <section class="filtros-categoria" id="filtros-series">
        <button class="btn-categoria ativo" data-serie="todas">Todas as Séries</button>
        <button class="btn-categoria" data-serie="infantil">Educação Infantil (3-5 anos)</button>
        <button class="btn-categoria" data-serie="1ano">1º Ano (6-7 anos)</button>
        <button class="btn-categoria" data-serie="2ano">2º Ano (7-8 anos)</button>
        <button class="btn-categoria" data-serie="3ano">3º Ano (8-9 anos)</button>
        <button class="btn-categoria" data-serie="4e5ano">4º e 5º Ano (9-11 anos)</button>
    </section>

    <!-- ========================================================
       5. FILTRO POR DISCIPLINA
       ======================================================== -->
    <section class="abas-status" id="filtros-materias">
        <button class="btn-aba ativa" data-materia="todas">Todas as Matérias</button>
        <button class="btn-aba" data-materia="portugues">📖 Língua Portuguesa</button>
        <button class="btn-aba" data-materia="matematica">🔢 Matemática</button>
        <button class="btn-aba" data-materia="ciencias">🌱 Ciências Naturais</button>
    </section>

    <!-- ========================================================
       6. GRELHA DE ATIVIDADES CADASTRADAS
       ======================================================== -->
    <main class="catalogo-desenhos" id="catalogo-atividades"></main>

    <!-- ========================================================
       7. MODAL DE RESOLUÇÃO ONLINE E REGISTRO DO ALUNO
       ======================================================== -->
    <div id="modal-fazer-atividade" class="modal-envio-tarefa">
        <div class="caixa-modal-envio">
            <h2 id="modal-titulo-ativ" style="color: #059669; font-size: 1.3rem; margin-bottom: 8px;">Realizar Atividade</h2>
            <p id="modal-enunciado-ativ" style="font-size: 0.9rem; color: #475569; margin-bottom: 14px;"></p>
            
            <label style="font-weight: bold; font-size: 0.85rem;">Sua Resposta / Resolução:</label>
            <textarea id="resposta-aluno" class="campo-formulario-aluno" rows="4" placeholder="Escreva a resposta da atividade aqui..."></textarea>

            <label style="font-weight: bold; font-size: 0.85rem;">Nome Completo do Aluno:</label>
            <input type="text" id="nome-aluno" class="campo-formulario-aluno" placeholder="Ex: Lucas Gabriel Silveira">

            <label style="font-weight: bold; font-size: 0.85rem;">Turma / Escola:</label>
            <input type="text" id="turma-aluno" class="campo-formulario-aluno" placeholder="Ex: 2º Ano B - Escola Municipal">

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-enviar-tarefa" class="btn-jogar" style="background-color: #059669; flex: 2; border: none; cursor: pointer;">
                    🚀 Enviar para Correção do Professor
                </button>
                <button id="btn-fechar-modal-ativ" class="btn-pag" style="flex: 1;">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ========================================================
       8. CARREGAMENTO DOS SCRIPTS
       ======================================================== -->
    <script src="js/atividades.js?v=95"></script>
</body>
</html>
