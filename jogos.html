<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ========================================================
       1. CABEÇALHO DO DOCUMENTO E METADADOS
       ======================================================== -->
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos e Desafios para Todas as Idades - ColorirOnline</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/database.js"></script>
</head>
<body>

    <!-- ========================================================
       2. CABEÇALHO PRINCIPAL E BARRA DE NAVEGAÇÃO
       ======================================================== -->
    <header class="cabecalho-principal">
        <div class="container-nav">
            <a href="index.html" class="logo">
                🎨 Colorir<span class="destaque">Online</span>
            </a>
            <div class="container-busca">
                <span class="icone-busca">🔍</span>
                <input type="text" id="campo-busca" placeholder="Pesquisar jogos, desafios...">
            </div>
            <nav class="links-navegacao">
                <a href="index.html" class="link-nav">🎨 Colorir</a>
                <a href="jogos.html" class="link-nav ativo">🧩 Jogos</a>
                <a href="atividades.html" class="link-nav">📚 Atividades Escolares</a>
                <a href="conquistas.html" class="link-nav">🏆 Conquistas</a>
                <a href="imprimir.html" class="link-nav">🖨 Imprimir A4</a>
                <button id="btn-tema-jogos" class="btn-tema" style="background: transparent !important; border: none !important;">🌙</button>
            </nav>
        </div>
    </header>

    <!-- ========================================================
       3. BANNER DE JOGOS (FAIXA ROXA PADRÃO)
       ======================================================== -->
    <section class="banner-faixa-universal banner-cor-roxo" style="width: 100% !important; background: linear-gradient(90deg, #6d28d9, #7c3aed, #a855f7) !important; padding: 22px 0 !important; margin: 0 0 20px 0 !important; display: block !important;">
        <div class="conteudo-banner-padrao" style="max-width: 1350px; margin: 0 auto; padding: 0 24px; text-align: left;">
            <h2 style="font-size: 1.8rem; font-weight: 800; color: #ffffff !important; margin-bottom: 4px; display: flex; align-items: center; gap: 8px;">
                🧩 Jogos e Desafios para Todas as Idades
            </h2>
            <p style="font-size: 0.95rem; color: #f1f5f9 !important; margin: 0; opacity: 0.95;">
                Exercite a mente com Caça-Palavras, Jogo da Memória e Quebra-Cabeças!
            </p>
        </div>
    </section>
    
    <!-- ========================================================
       4. FILTRO POR TIPO DE JOGO
       ======================================================== -->
    <section class="filtros-categoria" id="filtros-tipo-jogo">
        <button class="btn-categoria ativo" data-tipo="todos">Todos os Jogos</button>
        <button class="btn-categoria" data-tipo="caca-palavras">🔤 Caça-Palavras</button>
        <button class="btn-categoria" data-tipo="memoria">🧠 Jogo da Memória</button>
    </section>

    <!-- ========================================================
       5. FILTRO POR PÚBLICO / FAIXA ETÁRIA
       ======================================================== -->
    <section class="abas-status" id="filtros-idade-jogo">
        <button class="btn-aba ativa" data-publico="todos">Todas as Idades</button>
        <button class="btn-aba" data-publico="infantil">Infantil (Fácil)</button>
        <button class="btn-aba" data-publico="adultos">Adultos & Terceira Idade</button>
    </section>

    <!-- ========================================================
       6. GRELHA DE JOGOS
       ======================================================== -->
    <main class="catalogo-desenhos" id="catalogo-jogos"></main>

    <!-- ========================================================
       7. ARENA / MODAL INTERATIVO DO JOGO
       ======================================================== -->
    <div id="modal-jogo-arena" class="modal-envio-tarefa">
        <div class="caixa-modal-envio" style="max-width: 550px; text-align: center;">
            <h2 id="titulo-jogo-arena" style="color: #7c3aed; margin-bottom: 6px;">Arena de Jogo</h2>
            <p id="desc-jogo-arena" style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;"></p>
            
            <!-- Contêiner do Jogo Interativo -->
            <div id="tabuleiro-jogo-container" style="min-height: 280px; display: flex; align-items: center; justify-content: center; flex-direction: column;"></div>

            <button id="btn-fechar-arena" class="btn-pag" style="margin-top: 15px; width: 100%;">Sair do Jogo</button>
        </div>
    </div>

    <!-- ========================================================
       8. CARREGAMENTO DOS SCRIPTS
       ======================================================== -->
    <script src="js/jogos.js?v=35"></script>
</body>
</html>
